services:
  dhcp-server:
    image: mydhcp:ui-lab
    container_name: dhcp-ui-server
    build:
      context: ../..
      dockerfile: Dockerfile.ui
    privileged: true
    networks:
      dhcp-lab-net:
        ipv4_address: ${LAB_SERVER_IP}
    ports:
      - "8067:8067"
      - "8080:8080"
    volumes:
      - ./server.json:/etc/mydhcp/config.json:ro
    command: ["ui", "-config", "/etc/mydhcp/config.json", "-ui-listen", "0.0.0.0:8080"]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/state"]
      interval: 2s
      timeout: 3s
      retries: 20

networks:
  dhcp-lab-net:
    name: dhcp-lab-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${LAB_SUBNET}
          gateway: ${LAB_GATEWAY}
